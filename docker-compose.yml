version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: friends-pharmacy-demo-secret
      PORT: '4000'
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && node server.js"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
